<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Savant!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="api-base-url" content="/api" />
    <link rel="stylesheet" href="/styles/base.css" />
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <h1>Savant! <em><small>for ttom</small></em></h1>
            <nav class="nav">
                <a href="#" class="nav-link active" data-view="sops">Tableau de bord</a>
                <a href="#" class="nav-link" data-view="client-sops">Clients</a>
                <a href="/admin.html" class="nav-link" data-admin-link hidden>Admin</a>
            </nav>
            <div class="header-controls">
                <button type="button" id="create-sop-button" class="create-sop-button">Nouveau SOP</button>
                <div id="user-pill" class="user-pill">Pas connecté</div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- SOPs View -->
        <section id="view-sops">
            <section class="card sop-hero search-hero">
                <div class="search-hero__header">
                    <div class="sop-hero__eyebrow">Tableau de bord</div>
                    <h2 class="sop-hero__title">Rechercher un SOP</h2>
                    <p class="search-hero__subtitle">
                        Filtrez par mots-clés, catégorie ou tags pour trouver rapidement la bonne procédure.
                    </p>
                </div>

                <div class="search-hero__form">
                    <div class="search-hero__field">
                        <label for="filter-q" class="search-hero__label">Mots-clés</label>
                        <input id="filter-q" type="text" placeholder="Rechercher SOP ..." aria-describedby="dashboard-search-hint" />
                    </div>
                    <div class="search-hero__field">
                        <label for="filter-category" class="search-hero__label">Catégorie</label>
                        <input id="filter-category" type="text" placeholder="Catégorie ..." aria-describedby="dashboard-search-hint" />
                    </div>
                    <div class="search-hero__field">
                        <label for="filter-tags" class="search-hero__label">Tags</label>
                        <input id="filter-tags" type="text" placeholder="Tags (séparateur: ,)" aria-describedby="dashboard-search-hint" />
                    </div>
                    <div class="search-hero__actions">
                        <button id="apply-filters" onclick="applyFilters()">Appliquer</button>
                    </div>
                </div>
            </section>

            <div id="sop-tiles" class="tile-grid" style="margin-top:20px;">
                <!-- SOP tiles rendered dynamically -->
            </div>
        </section>

        <!-- Client SOPs View -->
        <section id="view-client-sops" style="display:none;">
            <section class="card sop-hero search-hero">
                <div class="search-hero__header">
                    <div class="sop-hero__eyebrow">Clients</div>
                    <h2 class="sop-hero__title">Rechercher un SOP client</h2>
                    <p class="search-hero__subtitle">
                        Filtrez par mots-clés ou par nom de client pour retrouver une procédure dédiée.
                    </p>
                </div>

                <div class="search-hero__form">
                    <div class="search-hero__field">
                        <label for="client-filter-q" class="search-hero__label">Mots-clés</label>
                        <input id="client-filter-q" type="text" placeholder="Rechercher SOP ..." aria-describedby="client-search-hint" />
                    </div>
                    <div class="search-hero__field">
                        <label for="client-filter-name" class="search-hero__label">Nom du client</label>
                        <input id="client-filter-name" type="text" placeholder="Nom du client..." aria-describedby="client-search-hint" />
                    </div>
                    <div class="search-hero__actions">
                        <button id="client-apply-filters" onclick="applyClientFilters()">Appliquer</button>
                    </div>
                </div>
            </section>

            <div id="client-sop-tiles" class="tile-grid" style="margin-top:20px;">
                <!-- Client SOP tiles rendered dynamically -->
            </div>
        </section>

    </main>

    <script src="/js/app.js"></script>
</body>

</html>
