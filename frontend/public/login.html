<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Savant! — Sign in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="api-base-url" content="/api" />
    <link rel="stylesheet" href="/styles/base.css" />
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1><a href="/" style="text-decoration:none; color:inherit;">Savant! <em><small>for ttom</small></em></a></h1>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <h2>Sign in</h2>
            <p class="muted">Entrez votre adresse mail de travail.</p>

            <form id="login-form" class="row" autocomplete="email">
                <label for="email" style="min-width:120px;">Email</label>
                <input id="email" name="email" type="email" placeholder="you@company.com" required />
                <button id="login-btn" type="submit">Demander lien d'accès</button>
            </form>
            <p id="login-msg" class="muted"></p>
        </div>
    </main>

    <script type="module" src="/js/login.js"></script>
</body>

</html>
