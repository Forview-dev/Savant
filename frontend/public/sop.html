<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Savant! — SOP Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="api-base-url" content="/api" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/sop.css" />
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1><a href="/" style="text-decoration:none; color:inherit;">Savant! <em><small>for ttom</small></em></a></h1>
            <div id="user-pill" class="user-pill">Non connecté</div>
        </div>
    </header>

    <main class="container sop-page">
        <section class="sop-hero card">
            <div class="sop-hero__content">
                <p id="sop-category" class="sop-hero__category">Catégorie</p>
                <h2 id="sop-title" class="sop-hero__title"></h2>
                <div id="sop-meta" class="sop-hero__meta"></div>
                <div id="sop-tags" class="sop-hero__tags"></div>
            </div>
            <div id="sop-actions" class="sop-hero__actions"></div>
        </section>

        <section id="sop-detail" class="sop-sections">
            <!-- SOP details dynamically rendered -->
        </section>

    </main>

    <!-- Delete confirmation modal -->
    <div id="modal-backdrop" class="modal-backdrop">
        <div class="modal">
            <h3>Confirmer</h3>
            <p>Êtes vous sûr de vouloir supprimer ce SOP ?</p>
            <div class="row" style="justify-content:flex-end;">
                <button id="modal-cancel" class="ghost">Annuler</button>
                <button id="modal-confirm" class="danger">Supprimer</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/sop.js"></script>
</body>

</html>
