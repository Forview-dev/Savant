<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Savant! — SOP Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="api-base-url" content="/api" />
    <link rel="stylesheet" href="/styles/base.css" />
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <h1><a href="/" style="text-decoration:none; color:inherit;">Savant! <em><small>for ttom</small></em></a></h1>
            <nav class="nav" aria-label="Administration">
                <a href="/admin.html" class="nav-link" data-admin-link hidden>Admin</a>
            </nav>
            <div id="user-pill" class="user-pill">Non connecté</div>
        </div>
    </header>

    <main class="container sop-page">
        <div id="sop-actions" class="sop-actions"></div>

        <div id="sop-detail" class="sop-detail">
            <!-- SOP details dynamically rendered -->
        </div>

    </main>

    <!-- Delete confirmation modal -->
    <div id="modal-backdrop" class="modal-backdrop">
        <div class="modal">
            <h3>Confirmer</h3>
            <p>Êtes vous sûr de vouloir supprimer ce SOP ?</p>
            <div class="row" style="justify-content:flex-end;">
                <button id="modal-cancel" class="ghost">Annuler</button>
                <button id="modal-confirm" class="danger">Supprimer</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/sop.js"></script>
</body>

</html>
